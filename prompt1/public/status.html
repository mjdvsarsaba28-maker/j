<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Booking Status</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-container">
      <a href="/" class="brand">🔧 Campus Tech Repair</a>
      <nav class="nav-links">
        <a href="/" class="nav-link">Services</a>
        <a href="/status.html" class="nav-link active">Check Status</a>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <h1 class="page-title">Check Booking Details</h1>
    <p class="page-subtitle">Enter your reference code to retrieve your appointment status.</p>

    <div id="message-banner" class="banner"></div>

    <div class="card">
      <form id="status-form" novalidate>
        <div class="form-group">
          <label for="reference" class="form-label">Reference Number</label>
          <input type="text" id="reference" class="form-control" placeholder="e.g. BK12A34B">
          <div id="reference-error" class="field-error"></div>
        </div>
        <button type="submit" id="search-btn" class="btn btn-primary">Lookup Booking</button>
      </form>
    </div>

    <div id="result-container"></div>
  </main>

  <script src="/js/main.js"></script>
  <script>
    document.getElementById("status-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearErrors();
      hideBanner();

      const referenceInput = document.getElementById("reference");
      const ref = referenceInput.value.trim();
      const resultContainer = document.getElementById("result-container");

      if (!ref) {
        showFieldError("reference", "Please enter a reference code.");
        return;
      }

      const searchBtn = document.getElementById("search-btn");
      setBtnLoading(searchBtn, true);
      resultContainer.innerHTML = '<div class="state-container"><p>Searching record...</p></div>';

      try {
        const response = await fetch(`/api/bookings/${ref}`);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Booking not found.");
        }

        resultContainer.innerHTML = `
          <div class="card" style="margin-top: 20px;">
            <h3 style="margin-bottom: 16px;">Booking #${data.reference}</h3>
            <div class="summary-list">
              <div class="summary-item">
                <span class="summary-label">Status</span>
                <span class="summary-value"><span class="badge badge-${data.status}">${data.status}</span></span>
              </div>
              <div class="summary-item">
                <span class="summary-label">Service</span>
                <span class="summary-value">${data.service_name}</span>
              </div>
              <div class="summary-item">
                <span class="summary-label">Estimated Price</span>
                <span class="summary-value">${formatPesos(data.service_price)}</span>
              </div>
              <div class="summary-item">
                <span class="summary-label">Date & Time</span>
                <span class="summary-value">${formatDate(data.booking_date)} at ${data.booking_time}</span>
              </div>
              <div class="summary-item">
                <span class="summary-label">Customer Name</span>
                <span class="summary-value">${data.name}</span>
              </div>
              <div class="summary-item">
                <span class="summary-label">Contact</span>
                <span class="summary-value">${data.contact}</span>
              </div>
              <div class="summary-item">
                <span class="summary-label">Email</span>
                <span class="summary-value">${data.email}</span>
              </div>
            </div>
          </div>
        `;
      } catch (error) {
        resultContainer.innerHTML = "";
        showBanner(error.message, "error");
      } finally {
        setBtnLoading(searchBtn, false);
      }
    });
  </script>
</body>
</html>
