<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Repair Service</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-container">
      <a href="/" class="brand">🔧 Campus Tech Repair</a>
      <nav class="nav-links">
        <a href="/" class="nav-link">Services</a>
        <a href="/status.html" class="nav-link">Check Status</a>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <h1 class="page-title">Book an Appointment</h1>
    <p class="page-subtitle">Fill out the form below to reserve your repair slot.</p>

    <div id="message-banner" class="banner"></div>

    <div class="card">
      <form id="booking-form" novalidate>
        <div class="form-group">
          <label for="service_id" class="form-label">Service</label>
          <select id="service_id" class="form-control">
            <option value="">Loading services...</option>
          </select>
          <div id="service_id-error" class="field-error"></div>
        </div>

        <div class="form-group">
          <label for="booking_date" class="form-label">Preferred Date</label>
          <input type="date" id="booking_date" class="form-control">
          <div id="booking_date-error" class="field-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Preferred Time Slot (07:00 AM - 05:00 PM)</label>
          <input type="hidden" id="booking_time">
          <div id="time-slots-container" class="time-slots-grid"></div>
          <div id="booking_time-error" class="field-error"></div>
        </div>

        <div class="form-group">
          <label for="guests" class="form-label">Number of Devices / Items</label>
          <input type="number" id="guests" class="form-control" value="1" min="1">
          <div id="guests-error" class="field-error"></div>
        </div>

        <div class="form-group">
          <label for="name" class="form-label">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="e.g. Juan Dela Cruz">
          <div id="name-error" class="field-error"></div>
        </div>

        <div class="form-group">
          <label for="contact" class="form-label">Contact Number</label>
          <input type="tel" id="contact" class="form-control" placeholder="e.g. 09123456789">
          <div id="contact-error" class="field-error"></div>
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="e.g. juan@example.com">
          <div id="email-error" class="field-error"></div>
        </div>

        <div class="form-group">
          <label for="notes" class="form-label">Issue Details / Additional Notes (Optional)</label>
          <textarea id="notes" class="form-control" rows="3" placeholder="Describe the problem..."></textarea>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary">Submit Booking</button>
      </form>
    </div>
  </main>

  <script src="/js/main.js"></script>
  <script>
    let selectedTime = "";

    function generateTimeSlots() {
      const container = document.getElementById("time-slots-container");
      container.innerHTML = "";
      
      for (let hour = 7; hour <= 17; hour++) {
        for (let min of [0, 30]) {
          if (hour === 17 && min === 30) continue;
          
          const hStr = String(hour).padStart(2, "0");
          const mStr = String(min).padStart(2, "0");
          const timeValue = `${hStr}:${mStr}`;
          
          const ampm = hour >= 12 ? "PM" : "AM";
          const displayHour = hour > 12 ? hour - 12 : (hour === 0 ? 12 : hour);
          const displayTime = `${displayHour}:${mStr} ${ampm}`;

          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "time-slot-btn";
          btn.textContent = displayTime;
          btn.onclick = () => {
            document.querySelectorAll(".time-slot-btn").forEach(b => b.classList.remove("selected"));
            btn.classList.add("selected");
            selectedTime = timeValue;
            document.getElementById("booking_time").value = timeValue;
          };
          container.appendChild(btn);
        }
      }
    }

    async function loadServicesDropdown() {
      const select = document.getElementById("service_id");
      try {
        const response = await fetch("/api/services");
        const services = await response.json();
        
        select.innerHTML = '<option value="">Select a service...</option>' + 
          services.map(s => `<option value="${s.id}">${s.name} (${formatPesos(s.price)})</option>`).join("");

        const urlParams = new URLSearchParams(window.location.search);
        const preselectedId = urlParams.get("service_id");
        if (preselectedId) {
          select.value = preselectedId;
        }
      } catch (error) {
        select.innerHTML = '<option value="">Error loading services</option>';
      }
    }

    document.getElementById("booking-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearErrors();
      hideBanner();

      const service_id = document.getElementById("service_id").value;
      const booking_date = document.getElementById("booking_date").value;
      const booking_time = document.getElementById("booking_time").value;
      const guests = document.getElementById("guests").value;
      const name = document.getElementById("name").value.trim();
      const contact = document.getElementById("contact").value.trim();
      const email = document.getElementById("email").value.trim();
      const notes = document.getElementById("notes").value.trim();

      let hasError = false;

      if (!service_id) { showFieldError("service_id", "Please select a service."); hasError = true; }
      if (!booking_date) { showFieldError("booking_date", "Please pick a date."); hasError = true; }
      if (!booking_time) { showFieldError("booking_time", "Please select a time slot."); hasError = true; }
      if (!guests || parseInt(guests, 10) < 1) { showFieldError("guests", "Must be at least 1."); hasError = true; }
      if (!name) { showFieldError("name", "Name is required."); hasError = true; }
      if (!contact) { showFieldError("contact", "Contact number is required."); hasError = true; }
      if (!email) { showFieldError("email", "Email address is required."); hasError = true; }

      if (hasError) return;

      const submitBtn = document.getElementById("submit-btn");
      setBtnLoading(submitBtn, true);

      try {
        const response = await fetch("/api/bookings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ service_id, booking_date, booking_time, guests, name, contact, email, notes })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Failed to submit booking");
        }

        window.location.href = `/confirmation.html?ref=${data.reference}`;
      } catch (error) {
        showBanner(error.message, "error");
      } finally {
        setBtnLoading(submitBtn, false);
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      generateTimeSlots();
      loadServicesDropdown();
      
      const dateInput = document.getElementById("booking_date");
      const today = new Date().toISOString().split("T")[0];
      dateInput.min = today;
    });
  </script>
</body>
</html>
