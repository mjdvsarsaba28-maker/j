<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Campus Tech Repair</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-container">
      <a href="/" class="brand">🔧 Campus Tech Repair</a>
      <nav class="nav-links">
        <a href="/" class="nav-link">Main Site</a>
      </nav>
    </div>
  </header>

  <main class="main-content" style="max-width: 420px; margin-top: 40px;">
    <h1 class="page-title" style="text-align: center;">Admin Portal</h1>
    <p class="page-subtitle" style="text-align: center;">Sign in to manage appointments</p>

    <div id="message-banner" class="banner"></div>

    <div class="card">
      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Enter username" required>
          <div id="username-error" class="field-error"></div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter password" required>
          <div id="password-error" class="field-error"></div>
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary" style="margin-top: 8px;">Sign In</button>
      </form>
    </div>
  </main>

  <script src="/js/main.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearErrors();
      hideBanner();

      const usernameInput = document.getElementById("username");
      const passwordInput = document.getElementById("password");
      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      let hasError = false;

      if (!username) {
        showFieldError("username", "Username is required.");
        hasError = true;
      }
      if (!password) {
        showFieldError("password", "Password is required.");
        hasError = true;
      }

      if (hasError) return;

      const loginBtn = document.getElementById("login-btn");
      setBtnLoading(loginBtn, true);

      try {
        const response = await fetch("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Authentication failed.");
        }

        window.location.href = "/admin/dashboard.html";
      } catch (error) {
        showBanner(error.message, "error");
      } finally {
        setBtnLoading(loginBtn, false);
      }
    });
  </script>
</body>
</html>
