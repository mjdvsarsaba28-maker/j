<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Campus Tech Repair</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      padding: 16px;
      text-align: center;
    }

    .stat-number {
      font-size: 1.875rem;
      font-weight: 700;
      color: var(--primary-color);
      margin-top: 4px;
    }

    .controls-bar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    @media (min-width: 640px) {
      .controls-bar {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
      .controls-bar .form-control {
        width: auto;
      }
    }

    .table-container {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      background-color: var(--card-bg);
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.875rem;
      min-width: 850px;
    }

    .admin-table th,
    .admin-table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
    }

    .admin-table th {
      background-color: #f1f5f9;
      font-weight: 600;
      color: var(--text-primary);
    }

    .admin-table tr:last-child td {
      border-bottom: none;
    }

    .action-group {
      display: flex;
      gap: 6px;
    }

    .btn-xs {
      min-height: 32px;
      padding: 4px 10px;
      font-size: 0.75rem;
      border-radius: 6px;
      width: auto;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-container">
      <a href="/admin/dashboard.html" class="brand">🔧 Admin Dashboard</a>
      <nav class="nav-links">
        <a href="/" class="nav-link" target="_blank">View Site</a>
        <button id="logout-btn" class="nav-link" style="background: none; border: none; cursor: pointer;">Logout</button>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div id="message-banner" class="banner"></div>

    <div class="stats-grid">
      <div class="card stat-card">
        <div class="summary-label">Total Bookings</div>
        <div id="stat-total" class="stat-number">0</div>
      </div>
      <div class="card stat-card">
        <div class="summary-label">Pending</div>
        <div id="stat-pending" class="stat-number" style="color: #d97706;">0</div>
      </div>
      <div class="card stat-card">
        <div class="summary-label">Confirmed</div>
        <div id="stat-confirmed" class="stat-number" style="color: #059669;">0</div>
      </div>
    </div>

    <div class="controls-bar">
      <input type="text" id="search-input" class="form-control" placeholder="Search reference, name, or service..." style="max-width: 320px;">
      <select id="status-filter" class="form-control" style="max-width: 180px;">
        <option value="all">All Statuses</option>
        <option value="pending">Pending</option>
        <option value="confirmed">Confirmed</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>

    <div class="table-container">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Reference</th>
            <th>Service</th>
            <th>Customer</th>
            <th>Contact</th>
            <th>Date & Time</th>
            <th>Items</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="bookings-tbody">
          <tr>
            <td colspan="8" class="state-container">Loading bookings...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="/js/main.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
