<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Repair Shop - Available Services</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-container">
      <a href="/" class="brand">🔧 Campus Tech Repair</a>
      <nav class="nav-links">
        <a href="/" class="nav-link active">Services</a>
        <a href="/status.html" class="nav-link">Check Status</a>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <h1 class="page-title">Repair Services</h1>
    <p class="page-subtitle">Select a service below to schedule an appointment with our IT technicians.</p>

    <div id="message-banner" class="banner"></div>
    <div id="services-container" class="services-grid"></div>
  </main>

  <script src="/js/main.js"></script>
  <script>
    async function loadServices() {
      const container = document.getElementById("services-container");
      container.innerHTML = '<div class="state-container"><p>Loading services...</p></div>';

      try {
        const response = await fetch("/api/services");
        if (!response.ok) throw new Error("Failed to load services");
        
        const services = await response.json();
        if (services.length === 0) {
          container.innerHTML = '<div class="state-container"><p>No services currently available.</p></div>';
          return;
        }

        container.innerHTML = services.map(service => `
          <div class="card service-card">
            <div>
              <h3>${service.name}</h3>
              <p style="color: var(--text-secondary); font-size: 0.875rem; margin-top: 6px;">${service.description}</p>
            </div>
            <div>
              <div class="service-price">${formatPesos(service.price)}</div>
              <a href="/book.html?service_id=${service.id}" class="btn btn-primary">Book now</a>
            </div>
          </div>
        `).join("");
      } catch (error) {
        container.innerHTML = `<div class="state-container"><p style="color: var(--danger-color);">${error.message}</p></div>`;
      }
    }

    document.addEventListener("DOMContentLoaded", loadServices);
  </script>
</body>
</html>
